          }
          [[ "$EXPECTED_COUNT" =~ ^[0-9]+$ ]] || { echo 'Invalid expected_count'; exit 1; }
          [[ ${#candidates[@]} -eq $EXPECTED_COUNT ]] || { echo 'Count changed: refusing deletion'; exit 1; }
          [[ "$CONFIRMATION" == "DELETE_${EXPECTED_COUNT}_VERIFIED_BRANCHES" ]] || {
