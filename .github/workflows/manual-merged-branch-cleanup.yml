            echo "Deleted: $name"
            deleted=$((deleted + 1))
          done
          echo "Removed $deleted inactive branch refs."
          echo "- Deleted: \`$deleted\`" >> "$GITHUB_STEP_SUMMARY"
\t'"$sha")
              continue
            fi

            comparison="$(gh api "repos/$REPO/compare/$sha...$default_sha")"
            if jq -e '(.behind_by == 0) and (.status == "ahead" or .status == "identical")' \
              <<< "$comparison" >/dev/null; then
              candidates+=("$name"
          done < <(jq -r '.[] | [.name, .commit.sha, (.protected | tostring)] | @tsv' <<< "$branches")

          echo "Default branch: $default_branch ($default_sha)"
          echo "Eligible inactive branches: ${#candidates[@]}"
