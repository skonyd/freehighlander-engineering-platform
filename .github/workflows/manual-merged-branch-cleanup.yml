            fresh_default="$(gh api "repos/$REPO/branches/$default_branch" --jq '.commit.sha')"
            [[ "$fresh_default" == "$default_sha" ]] || { echo 'Default moved: stopping'; exit 1; }
            fresh_ref="$(gh api "repos/$REPO/git/ref/heads/$name" --jq '.object.sha')"
            [[ "$fresh_ref" == "$sha" ]] || { echo "Branch changed: $name"; exit 1; }
            fresh_open="$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" | jq -sc 'add')"
            jq -e --arg name "$name" \
