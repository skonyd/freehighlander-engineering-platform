name: FreeHighlander CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: FreeHighlander CI / verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Pin npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Verify
        run: |
          npx prettier --write packages/evidence/src/evidence-policy.ts packages/evidence/test/evidence-policy.test.mjs tools/project/check-architecture.mjs
          git diff -- packages/evidence/src/evidence-policy.ts packages/evidence/test/evidence-policy.test.mjs tools/project/check-architecture.mjs
          exit 1
