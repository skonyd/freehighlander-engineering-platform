name: FreeHighlander CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Pin npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Format diagnostic
        run: |
          npx prettier --write packages/telemetry/src/index.ts packages/telemetry/src/jsonl-file-event-sink.ts packages/telemetry/test/telemetry.test.mjs
          git diff -- packages/telemetry/src/index.ts packages/telemetry/src/jsonl-file-event-sink.ts packages/telemetry/test/telemetry.test.mjs

      - name: Verify
        run: npm run verify
