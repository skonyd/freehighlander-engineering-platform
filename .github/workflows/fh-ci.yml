name: FreeHighlander CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: FreeHighlander CI / verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Pin npm
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Emit canonical Prettier diff
        run: |
          npx prettier --write apps/control-plane/src/execution-runtime.ts apps/control-plane/test/execution-runtime.test.mjs packages/orchestration/src/causal-trace.ts packages/telemetry/src/index.ts packages/telemetry/test/telemetry.test.mjs
          git diff -- apps/control-plane/src/execution-runtime.ts apps/control-plane/test/execution-runtime.test.mjs packages/orchestration/src/causal-trace.ts packages/telemetry/src/index.ts packages/telemetry/test/telemetry.test.mjs
          exit 1
