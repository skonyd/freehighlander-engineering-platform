name: FreeHighlander CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: FreeHighlander CI / verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Pin npm
        run: npm install --global npm@11.19.1

      - name: Generate canonical lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "LOCKFILE_BASE64_BEGIN"
          node -e "process.stdout.write(require('fs').readFileSync('package-lock.json').toString('base64'))"
          echo
          echo "LOCKFILE_BASE64_END"
          sha256sum package-lock.json
          exit 1
