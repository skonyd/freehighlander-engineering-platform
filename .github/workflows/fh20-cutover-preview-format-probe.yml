name: FH20 cutover preview format probe

on:
  push:
    branches:
      - fh20/exact-cutover-approval-preview

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          check-latest: false
      - run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Emit canonical Prettier diff
        run: |
          npx prettier --write packages/governance/src/cutover-approval-packet.ts packages/governance/test/cutover-approval-packet.test.mjs tools/project/lib/cutover-preview.mjs tools/project/test/cutover-preview.test.mjs
          git diff -- packages/governance/src/cutover-approval-packet.ts packages/governance/test/cutover-approval-packet.test.mjs tools/project/lib/cutover-preview.mjs tools/project/test/cutover-preview.test.mjs
          exit 1
