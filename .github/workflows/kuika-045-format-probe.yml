name: KUIKA 04.5 format probe

on:
  push:
    branches:
      - feat/fh-kuika-045-simulation-replay-preview

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          check-latest: false
      - run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Emit canonical Prettier diff
        run: |
          npx prettier --write apps/web/src/kuika-workflow-draft.ts apps/web/test/kuika-workflow-draft.test.mjs
          git diff -- apps/web/src/kuika-workflow-draft.ts apps/web/test/kuika-workflow-draft.test.mjs
          exit 1
