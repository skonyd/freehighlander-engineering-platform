name: FH-35A one-shot format

on:
  push:
    branches:
      - feat/fh-35a-operations
    paths:
      - .github/workflows/fh35a-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fh-35a-operations
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --global npm@11.19.1
      - run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Format and verify
        run: |
          npx prettier --write packages/operations/src/index.ts
          npm run verify
      - name: Commit formatted source and remove one-shot workflow
        run: |
          rm .github/workflows/fh35a-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(FH-35A): apply Prettier formatting"
          git push origin HEAD:feat/fh-35a-operations
