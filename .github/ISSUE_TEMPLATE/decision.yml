name: Architecture / Product Decision
description: Capture a decision that may require an ADR
title: "decision: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / decision needed
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Constraints / evidence
  - type: textarea
    id: affected
    attributes:
      label: Affected requirements / work items
  - type: checkboxes
    id: adr
    attributes:
      label: ADR
      options:
        - label: This decision should be promoted to an ADR when accepted
