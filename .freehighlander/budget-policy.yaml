schema_version: 1

budget_classes:
  soft:
    action:
      - reuse_check
      - cache_check
      - trim_irrelevant_context
      - targeted_retrieval
      - local_offload
      - cheaper_eligible_binding
  hard:
    action:
      - pause_new_paid_calls
      - human_override_or_wait

scopes:
  - run
  - logical_role
  - provider
  - project_period

rules:
  budget_exhausted_is_pass: false
  required_evidence_may_be_truncated_for_budget: false
  semantic_negative_result_may_trigger_cost_shopping: false
  debate_should_reserve_budget: true
  authority_may_not_be_lowered_for_cost: true

telemetry:
  record_estimated_cost: true
  record_actual_usage: true
  record_budget_scope: true
  record_budget_action: true
  record_tokens_saved_by_reuse: true
