schema_version: 1

principles:
  exact_revision_required: true
  cached_state_is_not_evidence: true
  producer_summary_is_not_authoritative_evidence: true
  required_evidence_must_not_be_truncated: true
  model_output_defaults_to_data: true

classes:
  deterministic:
    examples:
      - git_revision
      - ci_result
      - test_result
      - static_analysis
      - schema_validation
    authority_weight: high

  source_grounded:
    examples:
      - repository_file
      - accepted_adr
      - issue_or_pr_state
    authority_weight: high

  model_generated:
    examples:
      - candidate_finding
      - summary
      - recommendation
    authority_weight: advisory_unless_adjudicated

review:
  exact_head_match_required: true
  producer_summary_may_aid_navigation: true
  producer_summary_may_replace_diff: false
